<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Monetization MAP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { margin: 0; }
    #map { width: 100%; height: 100vh; }
    #titre {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: white;
      padding: 8px 16px; border-radius: 8px;
      z-index: 1000; font-size: 13px; text-align: center;
      white-space: nowrap;
    }
    #legende {
      position: absolute; bottom: 30px; left: 10px;
      background: rgba(0,0,0,0.75); color: white;
      padding: 10px 14px; border-radius: 8px;
      z-index: 1000; font-size: 12px;
    }
    .leg-item { display: flex; align-items: center; margin: 4px 0; }
    .dot { width: 13px; height: 13px; border-radius: 50%; margin-right: 8px; border: 2px solid white; }
  </style>
</head>
<body>

<div id="titre">🗺️ Network Monetization MAP</div>
<div id="legende">
  <div class="leg-item"><div class="dot" style="background:#00cc00"></div> Green zones</div>
  <div class="leg-item"><div class="dot" style="background:#ffa500"></div> Orange zones</div>
  <div class="leg-item"><div class="dot" style="background:#ff0000"></div> Red zones</div>
</div>
<div id="map"></div>

<script>
  var map = L.map('map', {
    center: [36.7372, 3.0865],
    zoom: 12
  });

// Définir les couches de base
var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri'
});

var plan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
});  

  
var villes = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}');

var routes = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}');

// Afficher satellite par défaut
plan.addTo(map);

// Contrôle utilisateur
var baseLayers = {
  "🛰️ Satellite" : satellite,
  "🗺️ Plan"      : plan
};
  
var overlays = {
  "🏙️ Villes"   : villes,
  "🛣️ Routes"   : routes
};



L.control.layers(baseLayers, overlays, { position: 'topright', collapsed: false }).addTo(map);


  
  fetch('Sites.csv')
    .then(r => r.text())
    .then(csv => {
      var lines = csv.split('\n');

      lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;

        var f = line.split(';');
        if (f.length < 3) return;

        var x    = parseFloat(f[0]);
        var y    = parseFloat(f[1]);
        var type = f[2].trim();

        if (isNaN(x) || isNaN(y)) return;

        var color  = '#00cc00';
        var radius = 6;

        if (type.match(/red|rouge/i))  { color = '#ff0000'; radius = 8; }
        if (type.match(/orange/i))     { color = '#ffa500'; radius = 7; }

        L.circleMarker([y, x], {
          radius: radius,
          fillColor: color,
          color: 'white',
          weight: 1.5,
          fillOpacity: 0.95
        }).addTo(map);

        if (type.match(/red|rouge/i)) {
          L.circle([y, x], {
            radius: 800,
            color: '#ff0000',
            weight: 2,
            fillColor: '#ff0000',
            fillOpacity: 0.12
          }).addTo(map);
        }
      });
    })
    .catch(err => console.error('Erreur CSV:', err));
</script>

</body>
</html>
