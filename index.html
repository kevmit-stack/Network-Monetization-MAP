<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Monetization MAP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { margin: 0; }
    #map { width: 100%; height: 100vh; }
    #titre {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: white;
      padding: 8px 16px; border-radius: 8px;
      z-index: 1000; font-size: 13px; text-align: center;
      white-space: nowrap;
    }
    #legende {
      position: absolute; bottom: 30px; left: 10px;
      background: rgba(0,0,0,0.75); color: white;
      padding: 10px 14px; border-radius: 8px;
      z-index: 1000; font-size: 12px;
    }
    .leg-item { display: flex; align-items: center; margin: 4px 0; }
    .dot { width: 13px; height: 13px; border-radius: 50%; margin-right: 8px; border: 2px solid white; }
  </style>
</head>
<body>

<div id="titre">🗺️ Network Monetization MAP</div>
<div id="legende">
  <div class="leg-item"><div class="dot" style="background:#00cc00"></div> Green zones</div>
  <div class="leg-item"><div class="dot" style="background:#ffa500"></div> Orange zones</div>
  <div class="leg-item"><div class="dot" style="background:#ff0000"></div> Red zones</div>
</div>
<div id="map"></div>

<script>
  // Fond satellite ESRI
  var map = L.map('map').setView([36.7, 3.0], 7);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri'
  }).addTo(map);

  var bounds = [];
  var redPoints = [];

  fetch('sites.csv')
    .then(r => r.text())
    .then(csv => {
      var lines = csv.split('\n');

      lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;

        // Séparateur ;
        var f = line.split(';');
        if (f.length < 3) return;

        var x    = parseFloat(f[0]);  // longitude
        var y    = parseFloat(f[1]);  // latitude
        var type = f[2].trim();

        // Ignorer l'en-tête
        if (isNaN(x) || isNaN(y)) return;

        var color  = '#00cc00';
        var radius = 6;

        if (type.match(/red|rouge/i))  { color = '#ff0000'; radius = 8; }
        if (type.match(/orange/i))     { color = '#ffa500'; radius = 7; }

        L.circleMarker([y, x], {
          radius: radius,
          fillColor: color,
          color: 'white',
          weight: 1.5,
          fillOpacity: 0.95
        }).addTo(map);

        bounds.push([y, x]);

        // Cercle rouge autour des zones rouges
        if (type.match(/red|rouge/i)) {
          L.circle([y, x], {
            radius: 800,
            color: '#ff0000',
            weight: 2,
            fillColor: '#ff0000',
            fillOpacity: 0.12
          }).addTo(map);
        }
      });

      // Zoom automatique sur les données
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    })
    .catch(err => console.error('Erreur CSV:', err));
</script>

</body>
</html>
