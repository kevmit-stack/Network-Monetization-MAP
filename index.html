<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Monetization MAP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { margin: 0; }
    #map { width: 100%; height: 100vh; }
    #titre {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white;
      padding: 8px 16px; border-radius: 8px;
      z-index: 1000; font-size: 13px; text-align: center;
      white-space: nowrap;
    }
    #legende {
      position: absolute; bottom: 30px; left: 10px;
      background: rgba(0,0,0,0.7); color: white;
      padding: 10px; border-radius: 8px;
      z-index: 1000; font-size: 12px;
    }
    .leg-item { display: flex; align-items: center; margin: 4px 0; }
    .dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; border: 2px solid white; }
  </style>
</head>
<body>
  <div id="titre">🗺️ Network Monetization MAP</div>
  <div id="legende">
    <div class="leg-item"><div class="dot" style="background:#00ff00"></div> Green zones</div>
    <div class="leg-item"><div class="dot" style="background:#ffa500"></div> Orange zones</div>
    <div class="leg-item"><div class="dot" style="background:#ff0000"></div> Red zones</div>
  </div>
  <div id="map"></div>

  <script>
    // Fond satellite ESRI (comme Google Earth)
    var map = L.map('map').setView([36.7, 3.0], 7);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri'
    }).addTo(map);

    // Charger et parser le KML manuellement
    fetch('Network_monetization_MAP_20260517.kml')
      .then(r => r.text())
      .then(kmlText => {
        var parser = new DOMParser();
        var kml = parser.parseFromString(kmlText, 'text/xml');
        var placemarks = kml.querySelectorAll('Placemark');
        var bounds = [];

        placemarks.forEach(function(pm) {
          var styleUrl = pm.querySelector('styleUrl');
          if (!styleUrl) return;
          var style = styleUrl.textContent.trim();

          // Points
          var pointEl = pm.querySelector('Point coordinates');
          if (pointEl) {
            var parts = pointEl.textContent.trim().split(',');
            var lon = parseFloat(parts[0]);
            var lat = parseFloat(parts[1]);
            if (isNaN(lat) || isNaN(lon)) return;

            var color = '#00cc00';
            var radius = 6;
            if (style.includes('red'))    { color = '#ff0000'; radius = 8; }
            if (style.includes('orange')) { color = '#ffa500'; radius = 7; }

            var marker = L.circleMarker([lat, lon], {
              radius: radius,
              fillColor: color,
              color: 'white',
              weight: 1,
              fillOpacity: 0.9
            }).addTo(map);

            bounds.push([lat, lon]);
          }

          // Polygones (cercles rouges)
          var polyEl = pm.querySelector('Polygon');
          if (polyEl) {
            var coordsEl = polyEl.querySelector('coordinates');
            if (!coordsEl) return;
            var coordsList = coordsEl.textContent.trim().split(/\s+/);
            var latLngs = coordsList.map(function(c) {
              var p = c.split(',');
              return [parseFloat(p[1]), parseFloat(p[0])];
            }).filter(function(p) { return !isNaN(p[0]) && !isNaN(p[1]); });

            if (latLngs.length > 0) {
              L.polygon(latLngs, {
                color: '#ff0000',
                weight: 2,
                fillColor: '#ff0000',
                fillOpacity: 0.13
              }).addTo(map);
            }
          }
        });

        // Zoom automatique sur les données
        if (bounds.length > 0) {
          map.fitBounds(bounds);
        }
      });
  </script>
</body>
</html>
